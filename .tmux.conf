# Prefix: Ctrl-a. Press it twice to send Ctrl-a to the application.
unbind-key C-b
set-option -g prefix C-a
bind-key C-a send-prefix

# Split at the current pane's working directory.
# - creates top/bottom panes; | creates left/right panes.
unbind-key '"'
unbind-key %
bind-key - split-window -v -c '#{pane_current_path}'
bind-key | split-window -h -c '#{pane_current_path}'

# Vim-style pane navigation and resizing (prefix, then key).
# Do not repeat navigation: subsequent typing belongs to the selected pane.
bind-key h select-pane -L
bind-key j select-pane -D
bind-key k select-pane -U
bind-key l select-pane -R
bind-key -r H resize-pane -L 5
bind-key -r J resize-pane -D 5
bind-key -r K resize-pane -U 5
bind-key -r L resize-pane -R 5

# Vim copy mode: prefix [, then v to select, y to copy, q to leave.
set-window-option -g mode-keys vi
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi C-v send-keys -X rectangle-toggle
bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel 'pbcopy'
bind-key -T copy-mode-vi Enter send-keys -X copy-pipe-and-cancel 'pbcopy'
bind-key -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel 'pbcopy'

# Enable extended keys so modified Enter (Shift+Enter, etc.) is reported
# correctly to applications (e.g. Pi, Neovim).
set-option -g extended-keys on
set-option -g extended-keys-format csi-u

# Keep Escape responsive in Vim/Neovim.
set-option -s escape-time 10

# Match Ghostty and Neovim's RGB colors; new panes advertise tmux capabilities.
set-option -g default-terminal 'tmux-256color'
# Append RGB entries only when missing, so reloads do not duplicate them and
# no fixed array index can collide with tmux's own defaults.
# xterm-256color covers SSH sessions and terminals that do not report xterm-ghostty.
if-shell "tmux show-options -sv terminal-features | grep -qx 'xterm-ghostty:RGB'" '' "set-option -as terminal-features 'xterm-ghostty:RGB'"
if-shell "tmux show-options -sv terminal-features | grep -qx 'xterm-256color:RGB'" '' "set-option -as terminal-features 'xterm-256color:RGB'"
set-option -g focus-events on
set-option -g mouse on
set-option -g history-limit 50000

# Number windows and panes from 1 and close gaps when a window is closed.
set-option -g base-index 1
set-window-option -g pane-base-index 1
set-option -g renumber-windows on

# Let applications (including Neovim over SSH) copy to the system clipboard via OSC 52.
set-option -s set-clipboard on

# New windows, like splits, start in the current pane's directory.
bind-key c new-window -c '#{pane_current_path}'

# Reload configuration without restarting the session.
bind-key r source-file ~/.tmux.conf \; display-message 'tmux configuration reloaded'
